name: pogetit_quests
description: "PoGetIt Quest Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Location and GPS
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  google_maps_flutter: ^2.18.1

  # Local storage
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5

  # Camera and photo evidence
  image_picker: ^1.1.2

  # Health Connect
  health: ^13.3.2

  # Firebase
  firebase_core: 4.0.0
  firebase_auth: 6.0.0
  cloud_firestore: 6.0.0
  pedometer: ^4.2.0
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Day 2 Master Quest Library
  assets:
    - assets/data/quest_catalog.json
